<!doctype html>
<html lang="ar" dir="rtl" data-title="title.home">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="مواقيتي - مواقيت الصلاة بدقة لأي مدينة في العالم | Mawaqiti - accurate prayer times for any city"
    />
    <title>مواقيتي</title>
    <script>
      (function () {
        var d = document.documentElement;
        var l = localStorage.getItem("lang") === "en" ? "en" : "ar";
        d.lang = l;
        d.dir = l === "ar" ? "rtl" : "ltr";
        d.dataset.theme =
          localStorage.getItem("theme") === "dark" ? "dark" : "light";
      })();
    </script>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body class="home">
    <div id="app-header"></div>

    <main>
      <section class="hero" id="search">
        <div class="container hero__inner">
          <span class="badge">
            <i class="fa-solid fa-circle-check"></i>
            <span data-i18n="hero.badge"></span>
          </span>
          <h1 class="hero__title" data-i18n="hero.title"></h1>
          <p class="hero__sub" data-i18n="hero.sub"></p>

          <div class="search-card glass">
            <button
              id="use-location-btn"
              class="btn btn--primary btn--lg"
              type="button"
            >
              <i class="fa-solid fa-location-crosshairs"></i>
              <span data-i18n="hero.useLocation"></span>
            </button>

            <div class="or"><span data-i18n="hero.or"></span></div>

            <div class="search-card__fields">
              <div id="country-combo"></div>
              <div id="city-combo"></div>
            </div>

            <button
              id="show-btn"
              class="btn btn--ghost btn--lg"
              type="button"
              disabled
            >
              <span data-i18n="btn.show"></span>
              <i class="fa-solid fa-arrow-right-long arrow"></i>
            </button>
          </div>
        </div>
      </section>

      <section class="container features">
        <div class="feature glass reveal is-visible">
          <i class="fa-solid fa-stopwatch"></i>
          <div>
            <h3 data-i18n="feat.1.t"></h3>
            <p data-i18n="feat.1.d"></p>
          </div>
        </div>
        <div class="feature glass reveal is-visible">
          <i class="fa-solid fa-calendar-days"></i>
          <div>
            <h3 data-i18n="feat.2.t"></h3>
            <p data-i18n="feat.2.d"></p>
          </div>
        </div>
        <div class="feature glass reveal is-visible">
          <i class="fa-solid fa-earth-americas"></i>
          <div>
            <h3 data-i18n="feat.3.t"></h3>
            <p data-i18n="feat.3.d"></p>
          </div>
        </div>
      </section>

      <section class="section" id="importance">
        <div class="container">
          <header class="section__head">
            <span class="eyebrow" data-i18n="importance.eyebrow"></span>
            <h2 data-i18n="importance.title"></h2>
            <p data-i18n="importance.sub"></p>
          </header>
          <div class="grid grid--3" id="importance-grid"></div>
        </div>
      </section>

      <section class="section" id="prayers">
        <div class="container">
          <header class="section__head">
            <span class="eyebrow" data-i18n="prayers.eyebrow"></span>
            <h2 data-i18n="prayers.title"></h2>
            <p data-i18n="prayers.sub"></p>
          </header>
          <div class="grid grid--chips" id="prayers-grid"></div>
        </div>
      </section>

      <section class="section" id="wudu">
        <div class="container">
          <header class="section__head">
            <span class="eyebrow" data-i18n="wudu.eyebrow"></span>
            <h2 data-i18n="wudu.title"></h2>
            <p data-i18n="wudu.sub"></p>
          </header>
          <ol class="steps" id="wudu-steps"></ol>
        </div>
      </section>

      <section class="section" id="guide">
        <div class="container">
          <header class="section__head">
            <span class="eyebrow" data-i18n="guide.eyebrow"></span>
            <h2 data-i18n="guide.title"></h2>
            <p data-i18n="guide.sub"></p>
          </header>
          <ol class="steps" id="guide-steps"></ol>
          <p class="note glass">
            <i class="fa-solid fa-circle-info"></i>
            <span data-i18n="guide.note"></span>
          </p>
        </div>
      </section>
    </main>

    <div id="app-footer"></div>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
