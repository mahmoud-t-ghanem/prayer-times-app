

<!doctype html>
<html lang="ar" dir="rtl" data-title="title.times">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مواقيت الصلاة</title>
    <script>
      (function () {
        var d = document.documentElement;
        var l = localStorage.getItem("lang") === "en" ? "en" : "ar";
        d.lang = l;
        d.dir = l === "ar" ? "rtl" : "ltr";
        d.dataset.theme =
          localStorage.getItem("theme") === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/prayer-times.css" />
  </head>
  <body class="times-page">
    <div id="app-header"></div>

    <main class="times">
      <div class="container">
        <!-- Loading -->
        <section id="state-loading" class="skeleton" aria-busy="true">
          <div class="sk sk--title"></div>
          <div class="sk sk--hero"></div>
          <div class="sk-grid">
            <div class="sk"></div>
            <div class="sk"></div>
            <div class="sk"></div>
            <div class="sk"></div>
            <div class="sk"></div>
            <div class="sk"></div>
          </div>
          <p class="skeleton__text">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span data-i18n="times.loading"></span>
          </p>
        </section>

        <!-- Error -->
        <section id="state-error" class="error-card glass" hidden>
          <i class="fa-solid fa-triangle-exclamation"></i>
          <h2 data-i18n="times.error.title"></h2>
          <p id="error-msg"></p>
          <div class="row">
            <button id="retry-btn" class="btn btn--primary" type="button">
              <i class="fa-solid fa-rotate-right"></i>
              <span data-i18n="times.retry"></span>
            </button>
            <a class="btn btn--ghost" href="index.html#search">
              <span data-i18n="times.back"></span>
            </a>
          </div>
        </section>

        <!-- Content -->
        <div id="state-content" hidden>
          <header class="place-head">
            <p class="eyebrow" id="place-country-wrap">
              <i class="fa-solid fa-location-dot"></i>
              <span id="place-country"></span>
            </p>
            <h1>
              <span data-i18n="times.in"></span>
              <span id="place-name" class="accent-text"></span>
            </h1>
            <div class="chips">
              <span class="chip"
                ><i class="fa-solid fa-calendar-day"></i
                ><span id="date-greg"></span
              ></span>
              <span class="chip"
                ><i class="fa-solid fa-moon"></i><span id="date-hijri"></span
              ></span>
              <span class="chip"
                ><i class="fa-solid fa-earth-africa"></i><span id="tz"></span
              ></span>
            </div>
          </header>

          <section class="now-card glass">
            <div class="now-card__main">
              <p class="label" data-i18n="times.next"></p>
              <div class="next">
                <i id="next-icon" class="fa-solid"></i>
                <h2 id="next-name"></h2>
                <span id="next-time" class="next__time"></span>
              </div>
              <div class="countdown" dir="ltr">
                <div class="cd">
                  <b id="cd-h">00</b><small data-i18n="unit.h"></small>
                </div>
                <div class="cd">
                  <b id="cd-m">00</b><small data-i18n="unit.m"></small>
                </div>
                <div class="cd">
                  <b id="cd-s">00</b><small data-i18n="unit.s"></small>
                </div>
              </div>
              <div class="progress"><div id="progress-bar"></div></div>
            </div>

            <div class="now-card__side">
              <p class="label" data-i18n="times.now"></p>
              <div id="clock" class="clock"></div>
              <div class="seg" role="group">
                <button
                  id="fmt12"
                  class="seg__btn"
                  type="button"
                  data-i18n-tip="times.fmt12"
                >
                  12
                </button>
                <button
                  id="fmt24"
                  class="seg__btn"
                  type="button"
                  data-i18n-tip="times.fmt24"
                >
                  24
                </button>
              </div>
            </div>
          </section>

          <section id="prayer-grid" class="prayer-grid"></section>

          <section class="info-row">
            <article class="glass reminder">
              <p class="eyebrow" data-i18n="times.reminder"></p>
              <blockquote id="reminder-text"></blockquote>
              <cite id="reminder-ref"></cite>
            </article>
            <article class="glass method">
              <p>
                <i class="fa-solid fa-calculator"></i> <span id="method"></span>
              </p>
              <div class="row">
                <a class="btn btn--ghost" href="index.html#search">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <span data-i18n="times.back"></span>
                </a>
                <button
                  id="refresh-btn"
                  class="btn btn--ghost"
                  type="button"
                  data-i18n-tip="times.refresh"
                >
                  <i class="fa-solid fa-rotate-right"></i>
                </button>
              </div>
            </article>
          </section>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>

    <script type="module" src="js/prayer-times.js"></script>
  </body>
</html>
